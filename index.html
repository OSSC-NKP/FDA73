<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSC-NKP One Stop Service Center</title>
    <!-- ใช้ Tailwind CSS เพื่อความทันสมัยและสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        
        /* 1. สไตล์สำหรับ Hero Banner แนวนอนขนาดใหญ่เต็มจอ */
        .hero-banner { 
            /* ลิงก์รูปภาพพื้นหลังแบนเนอร์ใหญ่ */
            background: url('https://drive.google.com/uc?export=view&id=1SxN2QqLcvO6ySK2IxVcrtb3EXsKhIM2C') no-repeat center center;
            background-size: cover;
            width: 100%;
            height: 40vh; /* ความสูง 40% ของหน้าจอ */
            min-height: 250px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* เพิ่ม Overlay สีดำจางๆ เพื่อให้ตัวหนังสืออ่านง่ายขึ้น */
        .hero-banner::before {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(6, 78, 59, 0.6); /* สีเขียวเข้มโปร่งแสง */
        }
        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .hidden-section { display: none !important; }
        
        /* สไตล์สำหรับรูปแบนเนอร์หมวดหมู่ย่อย */
        .banner-card { 
            transition: all 0.3s ease; 
            cursor: pointer; 
            border-radius: 1rem; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            background-color: white;
            border: 2px solid transparent;
            aspect-ratio: 16 / 9; /* รักษาสัดส่วนภาพ 16:9 ให้เป็นแนวนอนสวยงาม */
        }
        .banner-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 20px -5px rgba(0,0,0,0.15); 
            border-color: #10b981;
        }
        .banner-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Navbar แถบเมนูด้านบนสุด -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="cursor-pointer flex items-center gap-3" onclick="showDashboard()">
                <!-- โลโก้กลมๆ เล็กๆ ตรงเมนู (ถ้ามี) หรือใช้เป็นไอคอน -->
                <i class="fas fa-shield-alt text-2xl text-green-700"></i>
                <h1 class="text-xl font-bold text-gray-800">OSSC-NKP</h1>
            </div>
            
            <div id="guest-controls">
                <button onclick="showLoginSection()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 font-medium">
                    <i class="fas fa-user-lock"></i> เข้าสู่ระบบเจ้าหน้าที่
                </button>
            </div>

            <div id="admin-info" class="hidden-section flex items-center gap-4">
                <span class="bg-green-100 text-green-800 px-4 py-1.5 rounded-full text-sm font-medium border border-green-200">
                    <i class="fas fa-user-shield mr-1"></i> Admin
                </span>
                <button onclick="logout()" class="text-gray-500 hover:text-red-500 text-sm font-medium transition">
                    <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Banner แนวนอนขนาดใหญ่เต็มจอ -->
    <header class="hero-banner">
        <div class="hero-content">
            <!-- นำโลโก้ใหญ่มาวางตรงกลางแบนเนอร์ -->
            <img src="https://drive.google.com/uc?export=view&id=19ods5RKKpW_pa6fTahE6o1dGzg26aBQh" alt="OSSC Logo" class="h-24 md:h-32 w-auto mx-auto mb-4 bg-white p-2 rounded-full shadow-lg" onerror="this.style.display='none'">
            <h1 class="text-3xl md:text-5xl font-bold mb-2 shadow-sm">ศูนย์บริการเบ็ดเสร็จ</h1>
            <p class="text-lg md:text-xl opacity-90 shadow-sm">กองอาหารและยา จังหวัดนครปฐม (OSSC-NKP)</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-8 p-4">
        
        <!-- หน้า Login -->
        <section id="login-section" class="hidden-section max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl text-center border border-gray-100 mt-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">เข้าสู่ระบบเจ้าหน้าที่</h2>
                <button onclick="showDashboard()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="w-20 h-20 mx-auto bg-green-50 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-lock text-3xl text-green-600"></i>
            </div>
            
            <div class="space-y-4">
                <button onclick="loginAsAdmin()" class="w-full py-3 px-4 border-2 border-green-100 rounded-xl hover:bg-green-50 flex items-center justify-center gap-3 transition text-green-700 font-medium">
                    <i class="fas fa-cloud"></i> เข้าสู่ระบบด้วย e-office / Gmail
                </button>
                <button onclick="loginAsAdmin()" class="w-full py-3 px-4 bg-gray-800 text-white rounded-xl hover:bg-gray-900 flex items-center justify-center gap-3 transition font-medium">
                    <i class="fas fa-id-card"></i> เข้าสู่ระบบด้วย ThaiD
                </button>
            </div>
        </section>

        <!-- หน้าแสดงแบนเนอร์ (Dashboard) -->
        <section id="dashboard-section" class="block">
            <h2 class="text-2xl font-semibold mb-6 text-gray-800 border-l-4 border-green-600 pl-3">เลือกหมวดหมู่ที่ต้องการติดต่อ</h2>
            <div id="banner-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>

        <!-- หน้ารายการเอกสาร (ตารางดึงจาก Google Drive) -->
        <section id="documents-section" class="hidden-section mt-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <button onclick="showDashboard()" class="text-gray-500 hover:text-green-600 mb-2 font-medium transition"><i class="fas fa-arrow-left mr-1"></i> กลับไปหน้าหมวดหมู่</button>
                    <h2 id="doc-title" class="text-2xl font-semibold text-gray-800 border-l-4 border-green-600 pl-3">รายการเอกสาร: </h2>
                </div>
                
                <div id="admin-controls" class="hidden-section">
                    <a id="admin-upload-link" href="#" target="_blank" class="inline-block bg-green-600 text-white px-5 py-2.5 rounded-lg hover:bg-green-700 shadow-md transition font-medium">
                        <i class="fas fa-folder-open mr-2"></i> จัดการไฟล์ใน Google Drive
                    </a>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 border-b border-gray-200">
                            <th class="p-4 font-semibold w-16 text-center">ลำดับ</th>
                            <th class="p-4 font-semibold">ชื่อเอกสาร / กระบวนการ</th>
                            <th class="p-4 font-semibold text-center w-32">เปิด/ดาวน์โหลด</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="file-list-body">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // =========================================================
        const WEB_APP_API_URL = "https://script.google.com/macros/s/AKfycbxPWPJPIaJesd3Nx0tKilofliEsL9pue9Oit35aYNSVXftfSNEm2HVLWQ73UtGtU9rn/exec";
        // =========================================================

        const categories = [
            { name: "อาหาร", folderId: "1CTNwN-wBOPnQXtLrE1JxlWf-hQ1gB5wh", imageId: "1a_hBsH6mmvQXhkVObW2xAhVmkALrsROy" },
            { name: "ยา", folderId: "1v_BKXygYUjBGXC_CzS-IDKZdB5yGytGZ", imageId: "1HFmx3wOczmLEx6VicZ6VIidqEiJ_emqg" },
            { name: "ผลิตภัณฑ์สมุนไพร", folderId: "1kTUt9QOIbtM90K51GgiT56sU1htm2ASS", imageId: "1KI7lt2mNCa2CRv1wmfO_uFKcYQ4FUpjQ" },
            { name: "วัตถุเสพติด", folderId: "1SQT6PuM4EhJgXhHMavASb06zZ2TXBU9b", imageId: "1QhFlfOxjddxmkG9aHQ3k0-FmfB6_6Y0E" },
            { name: "เครื่องสำอาง", folderId: "1NPIlIpgvUrfJaP2OmnQ547MITMhymyh3", imageId: "1NnXc2dnAGaO0jfppXehU1HBmWnmwLnn1" },
            { name: "วัตถุอันตราย", folderId: "1y74GVe0Mj05defM2xBdST5nN3oCfUmut", imageId: "1cA5YaX3kHRQRKNqksuQT7t6asxKm0U4D" },
            { name: "เครื่องมือแพทย์", folderId: "1SD1WaNqVl25QnB12FKgKc2HPx9WUtwOm", imageId: "16uQB41Aiejn-WrtNnsZMxkJeGd172G7f" },
            { name: "สถานพยาบาล", folderId: "1UrsAQ5r7eQe4y0f32vzvtSnU69UjqEUM", imageId: "1q_6IOMkCX5mu158DeAoOTyCnwVXg5XK3" },
            { name: "สถานประกอบการเพื่อสุขภาพ", folderId: "1lXH4Er4CprXqJma5rmtpPWCUuHDB2sii", imageId: "1AMRpSPg-CRCEwMg4u497cWua0lzsOQf4" },
            { name: "กง.คุ้มครอง", folderId: "รอใส่_ID_โฟลเดอร์_กง_คุ้มครอง", imageId: "1SxN2QqLcvO6ySK2IxVcrtb3EXsKhIM2C" }
        ];

        const externalLinks = [
            { name: "ร้องเรียน", url: "https://onedrive.live.com/edit?id=6C4ED0EC113100DA!107&resid=6C4ED0EC113100DA!107&ithint=file%2Cxlsx&authkey=!AJTsaNWa2kBXB0c&wdo=2&cid=6c4ed0ec113100da", imageId: "รอใส่_ID_รูปร้องเรียน" },
            { name: "สอบถาม OSSC สสจ.นฐ.", url: "https://drive.google.com/drive/folders/1pCF-43KfuWsp6drXbrJRJpMDDCoqydb7?usp=drive_link", imageId: "รอใส่_ID_รูปสอบถาม" }
        ];

        let isAdmin = false; 

        window.onload = function() {
            renderBanners();
            showDashboard();
        };

        // ฟังก์ชันสร้างแบนเนอร์ แก้ไขปัญหาภาษาไทยเป็น ?????
        function renderBanners() {
            const grid = document.getElementById('banner-grid');
            grid.innerHTML = '';

            categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'banner-card bg-gray-100 flex items-center justify-center relative';
                card.onclick = () => showDocuments(cat.name, cat.folderId);
                
                // ถ้ารูปโหลดไม่ได้ ให้แสดงชื่อภาษาไทยตรงๆ ไม่ใช้ placehold.co
                const imgSrc = cat.imageId !== "รอใส่_ID_รูป" && !cat.imageId.includes("รอใส่") ? `https://drive.google.com/uc?export=view&id=${cat.imageId}` : '';
                
                if(imgSrc) {
                    card.innerHTML = `<img src="${imgSrc}" alt="${cat.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                      <div class="absolute inset-0 flex items-center justify-center text-gray-500 font-medium" style="display:none;">${cat.name}</div>`;
                } else {
                    card.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-gray-500 font-medium bg-green-50 border border-green-100">${cat.name}</div>`;
                }
                grid.appendChild(card);
            });

            externalLinks.forEach(link => {
                const card = document.createElement('div');
                card.className = 'banner-card bg-gray-100 flex items-center justify-center relative';
                card.onclick = () => window.open(link.url, '_blank');
                
                const imgSrc = link.imageId !== "รอใส่_ID_รูป" && !link.imageId.includes("รอใส่") ? `https://drive.google.com/uc?export=view&id=${link.imageId}` : '';
                
                if(imgSrc) {
                    card.innerHTML = `<img src="${imgSrc}" alt="${link.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                      <div class="absolute inset-0 flex items-center justify-center text-gray-500 font-medium" style="display:none;">${link.name}</div>`;
                } else {
                    card.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-gray-500 font-medium bg-red-50 border border-red-100">${link.name}</div>`;
                }
                grid.appendChild(card);
            });
        }

        function hideAllSections() {
            document.getElementById('login-section').classList.add('hidden-section');
            document.getElementById('dashboard-section').classList.add('hidden-section');
            document.getElementById('documents-section').classList.add('hidden-section');
        }

        function showDashboard() {
            hideAllSections();
            document.getElementById('dashboard-section').classList.remove('hidden-section');
        }

        function showLoginSection() {
            hideAllSections();
            document.getElementById('login-section').classList.remove('hidden-section');
        }

        function loginAsAdmin() {
            isAdmin = true;
            document.getElementById('guest-controls').classList.add('hidden-section');
            document.getElementById('admin-info').classList.remove('hidden-section');
            showDashboard();
        }

        function logout() {
            isAdmin = false;
            document.getElementById('admin-info').classList.add('hidden-section');
            document.getElementById('guest-controls').classList.remove('hidden-section');
            document.getElementById('admin-controls').classList.add('hidden-section');
            showDashboard();
        }

        async function showDocuments(categoryName, folderId) {
            hideAllSections();
            document.getElementById('documents-section').classList.remove('hidden-section');
            document.getElementById('doc-title').innerText = 'รายการเอกสาร: ' + categoryName;

            if (isAdmin) {
                document.getElementById('admin-controls').classList.remove('hidden-section');
                document.getElementById('admin-upload-link').href = `https://drive.google.com/drive/folders/${folderId}`;
            } else {
                document.getElementById('admin-controls').classList.add('hidden-section');
            }

            const tbody = document.getElementById('file-list-body');
            
            if (folderId.includes("รอใส่")) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-500">อยู่ระหว่างเตรียมข้อมูลเอกสารหมวดหมู่นี้</td></tr>`;
                return;
            }

            tbody.innerHTML = `<tr><td colspan="3" class="p-12 text-center text-green-600"><i class="fas fa-spinner fa-spin text-4xl mb-4"></i><p class="text-gray-600">กำลังดึงข้อมูลเอกสาร...</p></td></tr>`;

            try {
                const response = await fetch(`${WEB_APP_API_URL}?folderId=${folderId}`);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                if (data.success) {
                    if (data.files.length > 0) {
                        tbody.innerHTML = '';
                        data.files.forEach((file, index) => {
                            const cleanName = file.name.replace(/\.pdf$/i, '').replace(/\.doc$/i, '').replace(/\.docx$/i, '');
                            
                            tbody.innerHTML += `
                                <tr class="hover:bg-green-50 transition border-b border-gray-100">
                                    <td class="p-4 text-center text-gray-500">${index + 1}</td>
                                    <td class="p-4 text-gray-700 font-medium">${cleanName}</td>
                                    <td class="p-4 text-center">
                                        <a href="${file.viewUrl}" target="_blank" class="text-red-500 hover:text-red-700 text-2xl transition" title="เปิด/ดาวน์โหลดไฟล์">
                                            <i class="fas fa-file-pdf"></i>
                                        </a>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-500">ยังไม่มีเอกสารในหมวดหมู่นี้</td></tr>`;
                    }
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error("Fetch error:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><br>ไม่สามารถเชื่อมต่อ Google Drive ได้ หรือไม่มีสิทธิ์เข้าถึงโฟลเดอร์<br>โปรดตรวจสอบให้แน่ใจว่าโฟลเดอร์ Google Drive เปิดสิทธิ์แชร์เป็น "ทุกคนที่มีลิงก์"</td></tr>`;
            }
        }
    </script>
</body>
</html>
